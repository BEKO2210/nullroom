name: release

# Builds a release candidate from main and stores it as a DRAFT GitHub release.
# A draft is not public and creates no git tag; the tag appears only when a
# maintainer publishes the draft. Started by hand: Actions → release → Run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the draft release
      id-token: write # Sigstore signing identity
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install bubblewrap
        run: sudo apt-get update -q && sudo apt-get install -yq bubblewrap
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Start a systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          for _ in $(seq 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done

      # The same gates as CI; a release candidate is never built from a red tree.
      - run: npm ci
      - run: npm run doctor
      - run: npx tsc -p .
      - run: npm audit --audit-level=moderate
      - run: targets/smoke/build.sh
      - run: npm test
      - run: npm run pipeline
      - run: npm run verify work/smoke
      - run: npm run demo

      - name: Build artifacts
        id: build
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "tag $tag already exists; bump the version first" >&2; exit 1
          fi
          name="nullroom-$version"
          mkdir dist
          # Reproducible source archive: git archive of this commit, gzip without timestamp.
          git archive --format=tar --prefix="$name/" HEAD | gzip -n -9 > "dist/$name.tar.gz"
          npm sbom --sbom-format cyclonedx --package-lock-only > "dist/$name.sbom.cdx.json"
          npm sbom --sbom-format cyclonedx --package-lock-only --omit dev > "dist/$name.runtime.sbom.cdx.json"
          cp work/smoke/report.json "dist/$name.smoke-report.json"
          cp work/smoke/audit_chain.json "dist/$name.smoke-audit-chain.json"
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
          { echo "version=$version"; echo "tag=$tag"; echo "name=$name"; } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attest SBOM for the source archive
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/${{ steps.build.outputs.name }}.tar.gz
          sbom-path: dist/${{ steps.build.outputs.name }}.sbom.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.build.outputs.version }}
          path: dist/

      - name: Create draft release (no tag until published)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          {
            echo
            echo "Built by [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) from commit \`${GITHUB_SHA}\`."
            echo "Verify: \`gh attestation verify <file> -R ${GITHUB_REPOSITORY}\`"
          } >> notes.md
          gh release create "$TAG" dist/* --draft $prerelease --target "$GITHUB_SHA" \
            --title "Nullroom $VERSION" --notes-file notes.md
