name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Sigstore signing identity for the attestation below
      attestations: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install bubblewrap
        run: sudo apt-get update -q && sudo apt-get install -yq bubblewrap

      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor by
      # default; bwrap needs them to build the room jails.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Jails run inside rootless cgroup v2 scopes (memory, pids, cpu), which
      # need a systemd user manager. The runner has none until lingering is on.
      - name: Start a systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          for _ in $(seq 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          XDG_RUNTIME_DIR=/run/user/$uid systemd-run --user --scope --quiet -p TasksMax=4 -p MemoryMax=16M true

      - run: npm ci
      - name: Doctor (host prerequisites)
        run: npm run doctor
      - name: Typecheck
        run: npx tsc -p .
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Build stripped smoke target
        run: targets/smoke/build.sh
      - name: Tests
        run: npm test
      - name: End-to-end pipeline
        run: npm run pipeline
      - name: Verify audit chain
        run: npm run verify work/smoke
      - name: Demo (isolation, wall, oracle, tamper detection)
        run: npm run demo
      # Signs the run's report and audit chain with the workflow's identity
      # (Sigstore, keyless). Verify with: gh attestation verify <file> -R BEKO2210/nullroom
      - name: Attest report and audit chain
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            work/smoke/report.json
            work/smoke/audit_chain.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-report
          path: |
            work/smoke/report.json
            work/smoke/audit_chain.json
