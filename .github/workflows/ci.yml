name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install bubblewrap
        run: sudo apt-get update -q && sudo apt-get install -yq bubblewrap

      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor by
      # default; bwrap needs them to build the room jails.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: npm ci
      - name: Typecheck
        run: npx tsc -p .
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Build stripped smoke target
        run: targets/smoke/build.sh
      - name: Tests
        run: npm test
      - name: End-to-end pipeline
        run: npm run pipeline
      - name: Verify audit chain
        run: npm run verify work/smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-report
          path: |
            work/smoke/report.json
            work/smoke/audit_chain.json
